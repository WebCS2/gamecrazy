<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Privacy</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #020817, #06152e, #0a1f44);
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }

    .frame {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2);
      padding: 40px;
      border-radius: 20px;
      max-width: 500px;
      text-align: center;
      box-shadow: 0 0 30px rgba(59,130,246,0.3);
    }

    .back {
      position: absolute;
      top: 20px;
      left: 20px;
      cursor: pointer;
      padding: 10px 16px;
      border-radius: 12px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2);
    }
  </style>
</head>

<body>

  <div class="back" onclick="window.location.href='https://gamingnow.vercel.app'">
    ← Back
  </div>

  <div class="frame">
    <h1>Your Data isn't saved.</h1>
    <p>Ur cookies aren't saved.</p>
  </div>

</body>
</html>
