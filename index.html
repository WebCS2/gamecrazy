<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepSeek API Chat Interface</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
            width: 100%;
            max-width: 600px;
            height: 80vh;
            background: #ffffff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-header {
            background: #4d6bfe;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
        }
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 75%;
            padding: 10px 15px;
            border-radius: 15px;
            line-height: 1.4;
            white-space: pre-wrap; /* Preserves line breaks from the AI */
        }
        .user-message {
            background: #4d6bfe;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .bot-message {
            background: #f1f1f1;
            color: #333;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }
        .chat-input-area {
            display: flex;
            padding: 15px;
            border-top: 1px solid #eee;
            background: #fff;
        }
        .chat-input-area input {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid #ccc;
            border-radius: 20px;
            outline: none;
            font-size: 1rem;
        }
        .chat-input-area button {
            background: #4d6bfe;
            color: white;
            border: none;
            padding: 10px 20px;
            margin-left: 10px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s;
        }
        .chat-input-area button:hover {
            background: #3955db;
        }
        .chat-input-area button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">DeepSeek AI Assistant</div>
    <div class="chat-messages" id="chatMessages">
        <div class="message bot-message">Hello! How can I help you today?</div>
    </div>
    <div class="chat-input-area">
        <input type="text" id="userInput" placeholder="Type your message here..." autocomplete="off">
        <button id="sendBtn" onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    // Configuration
    const API_KEY = "b01611a6-9116-449e-b867-393e91779dfc";
    const API_URL = "https://api.deepseek.com/v1/chat/completions"; 
    const MODEL = "deepseek-chat"; // Uses DeepSeek-V3 / DeepSeek-R1 chat pipeline

    // Conversation history to maintain context
    let conversationHistory = [
        { role: "system", content: "You are a helpful assistant." }
    ];

    const chatMessages = document.getElementById('chatMessages');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');

    userInput.addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
            sendMessage();
        }
    });

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        // 1. Append User Message
        appendMessage(text, 'user-message');
        userInput.value = '';
        
        // 2. Add to context history
        conversationHistory.push({ role: "user", content: text });

        // Disable UI controls while waiting
        userInput.disabled = true;
        sendBtn.disabled = true;

        // 3. Create placeholder for DeepSeek response
        const botMessageDiv = appendMessage("Thinking...", 'bot-message');

        try {
            // 4. Send request to DeepSeek
            const response = await fetch(API_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${API_KEY}`
                },
                body: JSON.stringify({
                    model: MODEL,
                    messages: conversationHistory,
                    stream: false // Set to true if you ever want to implement chunk-by-chunk streaming
                })
            });

            if (!response.ok) {
                const errorData = await response.json().catch(() => ({}));
                throw new Error(errorData.error?.message || `HTTP error! status: ${response.status}`);
            }

            const data = await response.json();
            const reply = data.choices[0].message.content;

            // 5. Render final reply
            botMessageDiv.innerText = reply;

            // 6. Record response into history
            conversationHistory.push({ role: "assistant", content: reply });

        } catch (error) {
            console.error("DeepSeek API Error:", error);
            botMessageDiv.innerText = "Error fetching response: " + error.message;
            botMessageDiv.style.color = "red";
        } finally {
            // Re-enable interface
            userInput.disabled = false;
            sendBtn.disabled = false;
            userInput.focus();
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
    }

    function appendMessage(text, className) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${className}`;
        messageDiv.innerText = text;
        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
        return messageDiv;
    }
</script>

</body>
</html>
