<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepSeek API Chat Interface</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
            width: 100%;
            max-width: 600px;
            height: 80vh;
            background: #ffffff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-header {
            background: #4d6bfe;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
        }
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 75%;
            padding: 10px 15px;
            border-radius: 15px;
            line-height: 1.4;
            white-space: pre-wrap;
        }
        .user-message {
            background: #4d6bfe;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .bot-message {
            background: #f1f1f1;
            color: #333;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }
        .chat-input-area {
            display: flex;
            padding: 15px;
            border-top: 1px solid #eee;
            background: #fff;
        }
        .chat-input-area input {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid #ccc;
            border-radius: 20px;
            outline: none;
            font-size: 1rem;
        }
        .chat-input-area button {
            background: #4d6bfe;
            color: white;
            border: none;
            padding: 10px 20px;
            margin-left: 10px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s;
        }
        .chat-input-area button:hover {
            background: #3955db;
        }
        .chat-input-area button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">DeepSeek AI Assistant</div>
    <div class="chat-messages" id="chatMessages">
        <div class="message bot-message">Hello! How can I help you today?</div>
    </div>
    <div class="chat-input-area">
        <input type="text" id="userInput" placeholder="Type your message here..." autocomplete="off">
        <button id="sendBtn" onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    // Configuration
    const API_KEY = "b01611a6-9116-449e-b867-393e91779dfc";
    
    // We route through a public CORS proxy to allow browser-based testing
    const CORS_PROXY = "https://cors-anywhere.herokuapp.com/";
    const TARGET_URL = "https://api.deepseek.com/chat/completions";
    const API_URL = CORS_PROXY + TARGET_URL; 

    // DeepSeek current primary flagship models
    const MODEL = "deepseek-v4-flash"; 

    let conversationHistory = [
        { role: "system", content: "You are a helpful assistant." }
    ];

    const chatMessages = document.getElementById('chatMessages');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');

    userInput.addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
            sendMessage();
        }
    });

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        appendMessage(text, 'user-message');
        userInput.value = '';
        
        conversationHistory.push({ role: "user", content: text });

        userInput.disabled = true;
        sendBtn.disabled = true;

        const botMessageDiv = appendMessage("Thinking...", 'bot-message');

        try {
            const response = await fetch(API_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${API_KEY}`,
                    "X-Requested-With": "XMLHttpRequest" // Required by some proxies
                },
                body: JSON.stringify({
                    model: MODEL,
                    messages: conversationHistory
                })
            });

            if (!response.ok) {
                const errorText = await response.text();
                // Check if the proxy itself is asking for access activation
                if (errorText.includes("cors-anywhere")) {
                    throw new Error("Proxy requires activation. Please visit https://cors-anywhere.herokuapp.com/corsdemo and click 'Request temporary access', then try again.");
                }
                throw new Error(`HTTP error! status: ${response.status}`);
            }

            const data = await response.json();
            const reply = data.choices[0].message.content;

            botMessageDiv.innerText = reply;
            conversationHistory.push({ role: "assistant", content: reply });

        } catch (error) {
            console.error("DeepSeek API Error:", error);
            botMessageDiv.innerText = "Error: " + error.message;
            botMessageDiv.style.color = "red";
        } finally {
            userInput.disabled = false;
            sendBtn.disabled = false;
            userInput.focus();
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
    }

    function appendMessage(text, className) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${className}`;
        messageDiv.innerText = text;
        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
        return messageDiv;
    }
</script>

</body>
</html>
