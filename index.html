<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GamingNow</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #020817, #06152e, #0a1f44);
      color: white;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 80px 60px;
      min-height: 100vh;
    }

    .left {
      max-width: 650px;
    }

    h1 {
      font-size: 5rem;
      line-height: 1.1;
      margin-bottom: 25px;
      font-weight: 800;
    }

    .blue {
      color: #3b82f6;
    }

    .description {
      font-size: 1.4rem;
      color: rgba(255,255,255,0.7);
      line-height: 1.7;
      margin-bottom: 40px;
    }

    .btn {
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      border: none;
      color: white;
      padding: 18px 36px;
      border-radius: 18px;
      font-size: 1.3rem;
      font-weight: bold;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 14px;
      transition: 0.3s ease;
      box-shadow: 0 10px 30px rgba(37,99,235,0.4);
    }

    .btn:hover {
      transform: translateY(-4px) scale(1.03);
    }

    .play-icon {
      width: 0;
      height: 0;
      border-top: 10px solid transparent;
      border-bottom: 10px solid transparent;
      border-left: 16px solid white;
    }

    .footer-buttons {
      margin-top: 40px;
      display: flex;
      gap: 18px;
    }

    .footer-btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.15);
      color: white;
      padding: 14px 28px;
      border-radius: 16px;
      cursor: pointer;
      transition: 0.3s ease;
    }

    .footer-btn:hover {
      background: rgba(255,255,255,0.15);
    }

    /* SHINY BLUE OUTLINE */
    .glow-btn {
      border: 2px solid #3b82f6;
      box-shadow: 0 0 12px #3b82f6, 0 0 25px rgba(59,130,246,0.5);
    }

    .glow-btn:hover {
      box-shadow: 0 0 18px #3b82f6, 0 0 40px rgba(59,130,246,0.7);
      transform: translateY(-2px);
    }

    .right {
      position: relative;
      width: 450px;
      height: 450px;
    }

    .card {
      position: absolute;
      width: 150px;
      height: 150px;
      border-radius: 30px;
      background: linear-gradient(135deg, #2563eb, #38bdf8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4rem;
      box-shadow: 0 0 40px rgba(59,130,246,0.4);
      animation: float 4s ease-in-out infinite;
    }

    .card1 { top: 0; right: 0; }
    .card2 { left: 60px; bottom: 120px; animation-delay: 1s; }
    .card3 { right: 100px; bottom: 0; animation-delay: 2s; }

    @keyframes float {
      0%,100% { transform: translateY(0px); }
      50% { transform: translateY(-18px); }
    }

    @media (max-width: 1000px) {
      .container {
        flex-direction: column;
        text-align: center;
        gap: 60px;
        padding: 50px 20px;
      }

      h1 {
        font-size: 3.5rem;
      }

      .footer-buttons {
        justify-content: center;
      }

      .right {
        width: 100%;
        height: 320px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="left">
      <h1>
        Welcome to <span class="blue">Gaming</span><br>
        <span class="blue">Now</span>
      </h1>

      <p class="description">
        Play amazing games with a modern gaming experience.
        Fast, smooth, and built for everyone.
      </p>

      <button class="btn" onclick="window.location.href='/games'">
        <span class="play-icon"></span>
        Start Gaming
      </button>

      <div class="footer-buttons">
        <button class="footer-btn glow-btn" onclick="window.location.href='/privacypolicy'">
          Privacy And Policy
        </button>

        <button class="footer-btn glow-btn" onclick="window.location.href='/credits'">
          Credits
        </button>
      </div>
    </div>

    <div class="right">
      <div class="card card1">🎮</div>
      <div class="card card2">🕹️</div>
      <div class="card card3">💻</div>
    </div>

  </div>

</body>
</html>
