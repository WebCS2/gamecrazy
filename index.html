<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GameCrazy</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #020b24;
      color: white;
      min-height: 100vh;
      overflow: hidden;
    }

    .container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 80px 60px;
      position: relative;
    }

    .left {
      max-width: 600px;
      z-index: 2;
    }

    h1 {
      font-size: 5rem;
      line-height: 1.1;
      font-weight: 800;
      margin-bottom: 30px;
    }

    .blue {
      color: #2f7cff;
    }

    .description {
      font-size: 1.6rem;
      color: rgba(255,255,255,0.55);
      line-height: 1.7;
      margin-bottom: 40px;
    }

    .buttons {
      display: flex;
      gap: 20px;
      margin-bottom: 40px;
    }

    .btn {
      background: linear-gradient(135deg, #2f63e7, #3d8cff);
      border: none;
      color: white;
      padding: 18px 34px;
      border-radius: 18px;
      font-size: 1.3rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: 0.3s ease;
      box-shadow: 0 10px 30px rgba(47,124,255,0.35);
    }

    .btn:hover {
      transform: translateY(-3px) scale(1.03);
    }

    .play-icon {
      width: 0;
      height: 0;
      border-top: 10px solid transparent;
      border-bottom: 10px solid transparent;
      border-left: 16px solid white;
    }

    .stats-box {
      background: rgba(255,255,255,0.05);
      border-radius: 20px;
      padding: 25px 30px;
      width: 360px;
      margin-bottom: 35px;
      backdrop-filter: blur(10px);
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 15px 0;
      font-size: 1.5rem;
      letter-spacing: 2px;
      font-weight: bold;
    }

    .numbers {
      display: flex;
      gap: 10px;
    }

    .num {
      background: #17274d;
      color: #7dffd8;
      padding: 6px 12px;
      border-radius: 8px;
      min-width: 42px;
      text-align: center;
    }

    .bottom-buttons {
      display: flex;
      gap: 18px;
    }

    .bottom-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: white;
      padding: 16px 30px;
      border-radius: 18px;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s ease;
    }

    .bottom-btn:hover {
      background: rgba(255,255,255,0.15);
    }

    .right {
      position: relative;
      width: 500px;
      height: 500px;
    }

    .floating-box {
      position: absolute;
      width: 150px;
      height: 150px;
      border-radius: 30px;
      background: linear-gradient(135deg, #3258d8, #1bb4e8);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 4rem;
      box-shadow: 0 0 40px rgba(47,124,255,0.4);
      animation: float 4s ease-in-out infinite;
    }

    .box1 {
      top: 0;
      right: 0;
    }

    .box2 {
      bottom: 120px;
      left: 80px;
      animation-delay: 1s;
    }

    .box3 {
      bottom: 0;
      right: 120px;
      animation-delay: 2s;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-15px);
      }
    }

    @media(max-width: 1000px) {
      .container {
        flex-direction: column;
        gap: 50px;
        padding: 40px 20px;
      }

      h1 {
        font-size: 3.5rem;
      }

      .right {
        width: 100%;
        height: 300px;
      }
    }
  </style>
</head>
<body>
  <div class="container">

    <div class="left">
      <h1>
        Welcome to <span class="blue">Game</span><br>
        <span class="blue">Crazy</span>
      </h1>

      <p class="description">
        Your ultimate destination for games, web proxies,
        and virtual machines.
      </p>

      <div class="buttons">
        <button class="btn" onclick="window.location.href='/games'">
          <span class="play-icon"></span>
          Start Gaming
        </button>
      </div>

      <div class="bottom-buttons">
        <button class="bottom-btn">Privacy Policy</button>
        <button class="bottom-btn">Credits</button>
      </div>

        <div class="stat-row">
          <span>Unique Users:</span>
          <div class="numbers">
            <span class="num">2</span>
            <span class="num">4</span>
          </div>
        </div>
      </div>

      <div class="bottom-buttons">
        <button class="bottom-btn">Privacy Policy</button>
        <button class="bottom-btn">Credits</button>
      </div>
    </div>

    <div class="right">
      <div class="floating-box box1">🎮</div>
      <div class="floating-box box2">🛡️</div>
      <div class="floating-box box3">🖥️</div>
    </div>

  </div>

  <script>
    // Redirects user to /games page
    // Create a folder named 'games' with an index.html inside when uploading to Vercel/GitHub
  </script>
</body>
</html>
