<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Free AI Chatbot (Working)</title>
<style>
  body {
    background: #0b1220;
    color: #f9fafb;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  .chatbox {
    width: 100%;
    max-width: 600px;
    background: #111827;
    padding: 20px;
    border-radius: 12px;
  }
  #messages {
    height: 300px;
    overflow-y: auto;
    background: #1f2937;
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 15px;
  }
  .msg {
    margin-bottom: 12px;
    padding: 8px 12px;
    border-radius: 8px;
    max-width: 80%;
  }
  .user { background: #3b82f6; margin-left: auto; }
  .bot { background: #374151; margin-right: auto; }
  input {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    background: #1f2937;
    color: #f9fafb;
    border: 1px solid #374151;
  }
  button {
    margin-top: 10px;
    padding: 10px 16px;
    border-radius: 8px;
    background: #3b82f6;
    color: white;
    border: none;
    cursor: pointer;
  }
</style>
</head>
<body>

<h1>AI Chatbot</h1>
<p>Free replies, no API key, works in browser.</p>

<div class="chatbox">
  <div id="messages"></div>
  <input id="input" type="text" placeholder="Type your message...">
  <button onclick="sendMessage()">Send</button>
</div>

<script>
function addMessage(text, sender) {
  const messages = document.getElementById("messages");
  const div = document.createElement("div");
  div.className = "msg " + sender;
  div.textContent = text;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

async function sendMessage() {
  const input = document.getElementById("input");
  const text = input.value.trim();
  if (!text) return;

  addMessage(text, "user");
  input.value = "";

  addMessage("Thinking...", "bot");

  try {
    const response = await fetch(
      "https://text.pollinations.ai/api/text?text=" + encodeURIComponent(text)
    );

    const data = await response.json();

    const reply = data.text || "AI could not generate a reply.";

    const messages = document.getElementById("messages");
    messages.lastChild.textContent = reply;

  } catch (err) {
    const messages = document.getElementById("messages");
    messages.lastChild.textContent = "Error: AI failed to reply.";
  }
}
</script>

</body>
</html>
